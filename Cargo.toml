[package]
name = "chestcraft"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["multipart"] }
base64 = "0.23"
bitflags = "2.13.2"
bs58 = "0.5.1"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
futures-util = "0.3.34"
getrandom = "0.4.3"
governor = "0.10.4"
http = "1.5.0"
http-body-util = "0.1.5"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff", "qoi"] }
ipnet = "2.12.2"
jiff = "0.2.39"
maud = { version = "0.27.0", features = ["axum"] }
mime_guess = "2.0.5"
percent-encoding = "2.3.2"
pulldown-cmark = { version = "0.13.6", default-features = false, features = ["html"] }
quick-xml = "0.42.0"
rand = "0.10.3"
redb = "4.4.0"
rmcp = { version = "3.9.0", default-features = false, features = ["server", "transport-streamable-http-server"] }
resvg = { version = "0.49", default-features = false, features = ["text", "system-fonts", "raster-images"] }
rustix = { version = "1.1.6", features = ["fs", "process", "system"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "fs", "io-util", "net", "signal", "sync", "time", "process"] }
tokio-util = { version = "0.7.20", features = ["io"] }
toml = "1.2.0"
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["trace", "set-header", "limit"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zip = { version = "9.4.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
proptest = "1.12.0"
tempfile = "3.27.0"

# Optimized dependencies keep argon2 fast in tests (debug argon2 takes seconds per hash).
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
