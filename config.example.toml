# chestcraft configuration (example)
# DRAFT: the schema is finalized while the backend is built.
#
# Install as /etc/chestcraft/config.toml (owned by root, readable by the service user).
# Validate with `chestcraft check`, apply with `systemctl reload chestcraft`.
# An invalid file is rejected and the running config stays in place.
# Secrets (the Telegram bot token, an ntfy access token) are not in this file. They live
# in /etc/chestcraft/secrets.toml (owner root, mode 600), which systemd hands to the
# service with LoadCredential=secrets:/etc/chestcraft/secrets.toml:
#   telegram_token = "123456789:AA…"
#   ntfy_token = "tk_…"

[server]
listen = "0.0.0.0:3923"
public_url = "https://files.example.org"   # used in share links and messages
# Proxies whose forwarding headers are trusted (X-Forwarded-For, CF-Connecting-IP).
trusted_proxies = ["192.0.2.10", "192.0.2.11"]
# Requests that arrive through these proxies, or carry Cloudflare headers, count as remote.
remote_proxies = ["192.0.2.10"]
# Other requests from these networks count as local (LAN, VPN).
local_networks = ["192.168.0.0/16", "100.64.0.0/10", "127.0.0.0/8", "::1/128"]
timezone = "Europe/Berlin"

[paths]
state_dir = "/var/lib/chestcraft"     # database; keep it off the pool being monitored
cache_dir = "/var/cache/chestcraft"   # thumbnails
backup_dir = "/srv/chestcraft"        # nightly copy of the database + this file
# SMART data, written by `chestcraft collect` (root, chestcraft-collect.timer); the folder
# must belong to root. Keep it in line with RuntimeDirectory in chestcraft-collect.service.
smart_file = "/run/chestcraft-smart/smart.json"

[trash]
days = 30            # default for all volumes; 0 = never purge
purge_at = "04:00"

[uploads]
chunk_mib = 32
parallel = 3
abandoned_days = 7   # unfinished .part files are removed after this many days

# Thumbnails (480 px for the grid, 2048 px for the viewer) of pictures, videos, STL/3MF
# models, G-code and SVG are cached in <cache_dir>/thumbs; the least recently used go
# first once the cache is full. Videos, HEIC and AVIF need /usr/bin/ffmpeg.
[thumbnails]
cache_gib = 5
max_ffmpeg = 2       # ffmpeg processes at a time

[sessions]
user_days = 30            # sliding
remote_admin_hours = 12

[limits]
anon_downloads_per_ip = 4

# ---- Volumes ----------------------------------------------------------------
# The table key is the URL name: [volumes.Dokumente] -> https://files.example.org/Dokumente/
# Flags:
#   public               anyone may read without an account
#   remote               reachable from the internet (default true)
#   read_only            nobody may change anything in the volume
#   read_only_paths      areas nobody may change, relative to the volume
#   trash_days           overrides [trash] days
#   stage_folder_uploads folder uploads appear only once complete
#   note.de / note.en    shown as a banner in the folder view
#
# Deleting moves items to <root>/.chestcraft-trash and uploads collect in
# <root>/.chestcraft-uploads, where <root> is the highest folder of the volume on the same
# filesystem (a ZFS dataset inside a volume gets its own pair). chestcraft creates them
# when it may write there; otherwise create them owned by the service user. Both are
# hidden everywhere, also in zips and WebDAV.

[volumes.Dokumente]
path = "/srv/dokumente"

[volumes.Austausch]
path = "/srv/austausch"
public = true

[volumes.Fotos]
path = "/srv/fotos"
read_only_paths = ["immich"]   # managed by another app

[volumes.Backups]
path = "/srv/backups"
remote = false
read_only_paths = ["pve"]

[volumes.Eingang]
path = "/srv/eingang"
stage_folder_uploads = true
trash_days = 14
note.de = "Dateien hier werden alle 15 Minuten automatisch einsortiert."
note.en = "Files here are sorted automatically every 15 minutes."

# ---- Roles ------------------------------------------------------------------
# Per-volume permissions: r = list/download/preview, w = upload/new folder,
# m = rename/move, d = delete (to trash), s = create share links (never beyond own rights).
# Every non-empty set includes r.
# The built-in role "admin" has every permission on every volume, plus the dashboard,
# user management, all shares and the audit log. Each user has exactly one role,
# assigned in the admin UI.

[roles.familie]
Dokumente = "rwmds"
Fotos = "rwmds"
Austausch = "rwmd"

[roles.gast]
Austausch = "r"

# ---- Shares -------------------------------------------------------------------
# Share links (/s/<id>) work only on volumes with remote = true, never grant more than
# their creator has, and always have a password: four random words in the creator's
# language (built in: English, German) or one the creator picks (8+ characters).
# Public uploads into public volumes are opened by the admin on the Volumes page.
#
# More passphrase languages: one word per line (dice-numbered lists work as they are).
# [shares.wordlists]
# fr = "/etc/chestcraft/words-fr.txt"

# ---- Appearance ---------------------------------------------------------------
# Skins, default backgrounds and the rotation default are set by the admin on the
# Appearance page; each account may pick its own. Background images are re-encoded
# (JPEG, at most 3840 px, metadata removed) and kept in <state_dir>/backgrounds.
[appearance]
max_backgrounds_per_user = 10   # image sets per account; admins have no limit
deny_upload_roles = ["gast"]    # roles that may not upload background images

# ---- Disks ------------------------------------------------------------------
# The admin dashboard finds pools (ZFS), md arrays and disks by itself. Bay labels by
# serial number, so alerts name the disk to pull.
[disks]
"WD-EXAMPLE0001" = "Bay 1 (left)"
"WD-EXAMPLE0002" = "Bay 2"

# ---- Alerts -----------------------------------------------------------------
# Alerts go to every configured channel (Telegram, ntfy) plus the dashboard banner.
# Tokens are secrets and live in the credentials file, not here.
[alerts]
language = "de"        # language of alert messages
digest = "Sun 10:00"   # weekly summary; also proves the alert path still works

[alerts.telegram]
chat_id = 0            # 0 = off; find yours with `chestcraft telegram-setup`

[alerts.ntfy]
server = "https://ntfy.sh"
topic = ""             # empty = off; pick a long, unguessable topic name

# Alert when a value is above its limit (defaults shown). A message goes out when an alert
# starts and when it ends; critical ones repeat every 24 hours. Rising error counters
# (SMART, pool read/write/checksum) send one message each time they rise.
[alerts.thresholds]
pool_full_warn = 80    # % of a pool
pool_full_crit = 90
quota_full = 90        # % of a dataset's quota
root_fs_full = 85      # % of the system disk
scrub_days = 40        # days since the last scrub
hdd_temp = 50          # °C
ssd_temp = 70          # °C, SATA SSDs and NVMe
ssd_wear = 80          # % of rated endurance used
stale_minutes = 120    # SMART data older than this

# Newest snapshot older than this → alert. A rule covers the dataset and everything below
# it; the longest matching name wins; "0" switches a subtree off. No rules = no checks.
[alerts.snapshots]
"tank/data" = "2h"
"tank/media" = "2d"
"tank/scratch" = "0"

# ---- MCP server for agents --------------------------------------------------
# AI agents (Claude Code, Hermes, …) use the files through MCP (Streamable HTTP at /mcp) on
# their own port, reachable only from the local networks: requests with Cloudflare headers
# or from outside server.local_networks are refused. Agents are accounts with a role from
# [roles] (never admin) and bearer tokens instead of a password:
#   chestcraft agent add hermes --role agenten
#   chestcraft agent token hermes "aipc" --expires 90d
# Assume an agent can be steered by what it reads, and that a cloud model sends what it
# reads to its provider: give each agent the smallest role it needs.
[mcp]
listen = ""            # e.g. "0.0.0.0:3925"; empty = no MCP server
# Host names clients use to reach the MCP server; requests for other hosts get 403 (DNS
# rebinding). Without a port, any port matches.
hosts = ["nas.example.lan:3925", "100.64.0.5:3925"]
origins = []           # browser origins allowed to call; empty = refuse any Origin header
health_roles = []      # agent roles that may read the health data (pools, disks, alerts)
max_read_mib = 4       # largest piece one read_file returns
max_write_mib = 16     # largest file one write_file writes
notify_shares = true   # alert through the channels above for every share an agent creates
max_concurrent = 4     # calls one agent may run at the same time
calls_per_minute = 120
