# English UI strings. Placeholders in braces are filled in by the server.
# Plurals: key_one for 1, key_other otherwise.

[meta]
name = "English"

[format]
decimal = "."
group = ","
# Tokens: {d} day, {d2} two-digit day, {m2} two-digit month, {mon} month name, {y} year,
# {H} hour, {M} minute.
datetime = "{d} {mon} {y}, {H}:{M}"
months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"]

