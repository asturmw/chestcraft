# /etc/smartd.conf for a chestcraft machine: smartd only schedules self-tests; chestcraft
# reads the results (chestcraft-collect.timer) and sends the alerts, so smartd sends no
# mail (no -m).
#
#   -a                 monitor everything smartd knows (health, attributes, logs)
#   -n standby,q       don't wake sleeping disks for a check, and don't log that it skipped
#   -s (S/…|L/…)       short self-test every Sunday at 03:00; long self-test on the 4th
#                      Saturday of the month (the Saturday between the 22nd and the 28th)
#                      at 01:00
#
# Install: back up the old file, copy this one over it, `systemctl restart smartmontools`.
DEVICESCAN -a -n standby,q -s (S/../../7/03|L/../(22|23|24|25|26|27|28)/6/01)
